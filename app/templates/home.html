<!DOCTYPE html>
<html>
<head>
    <title>NKOD - Dataset Search</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>
<body>
    <h2>NKOD - Dataset Search</h2>
    <form method="POST">
        <input type="text" name="query" placeholder="Search" value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    {% if results %}
        <h3>Results:</h3>
        <table border="1" cellpadding="6" cellspacing="0">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Text</th>
                    <th>URL</th>
                </tr>
            </thead>
            <tbody>
                {% for dataset in results %}
                <tr>
                    <td>{{ dataset.title }}</td>
                    <td>{{ dataset.text }}</td>
                    <td>{{ dataset.url }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No results found.</p>
    {% endif %}
</body>
</html>
