<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>
<body class="home-page">
    <div class="language-selector">
        <select id="language" name="language" class="language-dropdown">
            <option value="en">🇬🇧</option>
            <option value="cs">🇨🇿</option>
        </select>
    </div>

    <div class="container">
        <h1 class="title">Dataset Search</h1>

        <form method="POST" action="/search" class="search-form">
            <div class="search-container">
                <input
                    type="text"
                    name="query"
                    class="search-input"
                    placeholder="Search for datasets..."
                    autofocus
                    required
                >
                <button type="submit" class="search-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="10" cy="10" r="7"></circle>
                        <path d="m15 15 6 6"></path>
                    </svg>
                </button>
            </div>
        </form>

        <p class="subtitle">AI powered dataset search for the <a href="https://data.gov.cz/" target="_blank" rel="noopener noreferrer" class="subtitle-link">Czech National Open Data Catalog</a>.</p>
    </div>

    {% include 'footer.html' %}
</body>
</html>
