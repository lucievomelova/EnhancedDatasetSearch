<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ollama Page</title>
    <style>
      body { font-family: sans-serif; padding: 2em; background-color: #f9f9f9; }
      input, button { padding: 0.5em; margin-top: 0.5em; }
      a { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>

  <body>
    <a href="{{ url_for('index') }}">← Back to Home</a>
    <h1>Ollama Page</h1>

    <form method="POST">
      <input type="text" name="text_input" placeholder="Enter something..." required>
      <button type="submit">Submit</button>
    </form>
    <h3>Answer:</h3>
    {% if result %}
      <p><strong>{{ result }}</strong></p>
    {% endif %}
  </body>
</html>
